name: REQUEST PACKAGES INSTALLATION
on:
  push:
    branches:
    - master
jobs:
  package-job:
    runs-on: ubuntu-latest

    steps:
    - name: check repo
      uses: actions/checkout@v4

    - name: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: install dependencies
      run: pip install -r requirements.txt

    - name: python version
      run: python --version

    - name: run python file
      run: python hello.py
