name: RUNNING PYTHON PROGRAM
on:
  push:
    branches:
    - master

jobs:
  python-job:
    runs-on: ubuntu-latest

    steps:
    - name: CHECKOUT REPO
      uses: actions/checkout@v4

    - name: INSTALL PYTHON
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: check python verson
      run: python --version

    - name: Run python file
      run: python python.py
